<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 330" font-family="Cambria Math, Times New Roman, serif" font-size="17">
  <defs>
    <marker id="ar12" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,3 L0,6 Z" fill="#111"/>
    </marker>
  </defs>
  <!-- 原点(110,250)，x比例44，y比例34；台阶 y=k -->
  <g fill="none" stroke="#111" stroke-width="1.5">
    <line x1="22" y1="250" x2="318" y2="250" marker-end="url(#ar12)"/>
    <line x1="110" y1="318" x2="110" y2="30" marker-end="url(#ar12)"/>
    <g fill="#111" stroke="none">
      <text x="306" y="272">x</text><text x="118" y="38">y</text>
      <text x="92" y="268">O</text>
    </g>
    <!-- 台阶：左端点实心，右端点空心 -->
    <g stroke-width="2">
      <!-- k=-2 : y=318 -->
      <line x1="22" y1="318" x2="66" y2="318"/>
      <!-- k=-1 : y=284 -->
      <line x1="66" y1="284" x2="110" y2="284"/>
      <!-- k=0 : y=250 -->
      <line x1="110" y1="250" x2="154" y2="250"/>
      <!-- k=1 : y=216 -->
      <line x1="154" y1="216" x2="198" y2="216"/>
      <!-- k=2 : y=182 -->
      <line x1="198" y1="182" x2="242" y2="182"/>
      <!-- k=3 : y=148 -->
      <line x1="242" y1="148" x2="286" y2="148"/>
    </g>
    <!-- 竖连接段 -->
    <g stroke-width="1" opacity="0.55">
      <line x1="66" y1="318" x2="66" y2="284"/>
      <line x1="110" y1="284" x2="110" y2="250"/>
      <line x1="154" y1="250" x2="154" y2="216"/>
      <line x1="198" y1="216" x2="198" y2="182"/>
      <line x1="242" y1="182" x2="242" y2="148"/>
    </g>
    <g fill="#111" stroke="none">
      <circle cx="22" cy="318" r="4"/><circle cx="66" cy="284" r="4"/><circle cx="110" cy="250" r="4"/>
      <circle cx="154" cy="216" r="4"/><circle cx="198" cy="182" r="4"/><circle cx="242" cy="148" r="4"/>
    </g>
    <g fill="#fff" stroke="#111" stroke-width="1.4">
      <circle cx="66" cy="318" r="4"/><circle cx="110" cy="284" r="4"/><circle cx="154" cy="250" r="4"/>
      <circle cx="198" cy="216" r="4"/><circle cx="242" cy="182" r="4"/><circle cx="286" cy="148" r="4"/>
    </g>
    <g fill="#111" stroke="none" text-anchor="middle" font-size="14">
      <text x="44" y="300">−2</text><text x="88" y="300">−1</text><text x="132" y="272">1</text>
      <text x="176" y="238">2</text><text x="220" y="204">3</text>
    </g>
    <text x="180" y="60" fill="#111" stroke="none" font-size="18">y = [x]</text>
  </g>
</svg>
