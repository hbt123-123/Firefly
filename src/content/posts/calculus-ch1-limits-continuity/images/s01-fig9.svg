<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 250" font-family="Cambria Math, Times New Roman, serif" font-size="16">
  <defs>
    <marker id="ar9" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,3 L0,6 Z" fill="#111"/>
    </marker>
  </defs>
  <g fill="none" stroke="#111" stroke-width="1.4">
    <!-- ============ arcsin，原点(120,140) x比例65 y比例36 ============ -->
    <line x1="30" y1="140" x2="212" y2="140" marker-end="url(#ar9)"/>
    <line x1="120" y1="224" x2="120" y2="26" marker-end="url(#ar9)"/>
    <line x1="55" y1="40" x2="55" y2="210" stroke-dasharray="4,4"/>
    <line x1="185" y1="40" x2="185" y2="210" stroke-dasharray="4,4"/>
    <line x1="40" y1="83.4" x2="198" y2="83.4" stroke-dasharray="4,4"/>
    <line x1="40" y1="196.6" x2="198" y2="196.6" stroke-dasharray="4,4"/>
    <path d="M55,196.6 C120,196.6 120,83.4 185,83.4" stroke-width="2"/>
    <g fill="#111" stroke="none" text-anchor="middle">
      <text x="55" y="162">−1</text><text x="185" y="162">1</text>
      <text x="112" y="89" text-anchor="end">π/2</text>
      <text x="112" y="202" text-anchor="end">−π/2</text>
      <text x="120" y="20">y = arcsin x</text>
    </g>

    <!-- ============ arccos，原点(360,140) ============ -->
    <line x1="270" y1="140" x2="452" y2="140" marker-end="url(#ar9)"/>
    <line x1="360" y1="224" x2="360" y2="26" marker-end="url(#ar9)"/>
    <line x1="295" y1="40" x2="295" y2="210" stroke-dasharray="4,4"/>
    <line x1="425" y1="40" x2="425" y2="210" stroke-dasharray="4,4"/>
    <line x1="280" y1="27" x2="440" y2="27" stroke-dasharray="4,4"/>
    <path d="M295,27 C360,27 360,140 425,140" stroke-width="2"/>
    <g fill="#111" stroke="none" text-anchor="middle">
      <text x="295" y="162">−1</text><text x="425" y="162">1</text>
      <text x="352" y="33" text-anchor="end">π</text>
      <text x="352" y="146" text-anchor="end">0</text>
      <text x="360" y="20">y = arccos x</text>
    </g>

    <!-- ============ arctan，原点(600,140) x比例34 ============ -->
    <line x1="490" y1="140" x2="712" y2="140" marker-end="url(#ar9)"/>
    <line x1="600" y1="224" x2="600" y2="26" marker-end="url(#ar9)"/>
    <line x1="498" y1="83.4" x2="708" y2="83.4" stroke-dasharray="4,4"/>
    <line x1="498" y1="196.6" x2="708" y2="196.6" stroke-dasharray="4,4"/>
    <path d="M505,196.6 C560,196.6 640,83.4 695,83.4" stroke-width="2"/>
    <g fill="#111" stroke="none" text-anchor="middle">
      <text x="592" y="89" text-anchor="end">π/2</text>
      <text x="592" y="202" text-anchor="end">−π/2</text>
      <text x="600" y="20">y = arctan x</text>
    </g>
  </g>
</svg>
