<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 770 360" font-family="Georgia, 'Times New Roman', serif">
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#37474f"/></marker>
</defs>
<rect width="770" height="360" fill="#ffffff"/>
<circle cx="110" cy="210" r="7" fill="#37474f"/>
<circle cx="385" cy="210" r="7" fill="#37474f"/>
<circle cx="660" cy="210" r="7" fill="#37474f"/>
<text x="110" y="250" font-size="24" fill="#263238" font-style="italic" text-anchor="middle">x</text>
<text x="385" y="250" font-size="24" fill="#263238" font-style="italic" text-anchor="middle">u</text>
<text x="660" y="250" font-size="24" fill="#263238" font-style="italic" text-anchor="middle">y</text>
<line x1="124" y1="210" x2="369" y2="210" stroke="#1565c0" stroke-width="2.4" marker-end="url(#arr)"/>
<line x1="399" y1="210" x2="644" y2="210" stroke="#1565c0" stroke-width="2.4" marker-end="url(#arr)"/>
<text x="247" y="196" font-size="21" fill="#1565c0" font-style="italic" text-anchor="middle">g</text>
<text x="522" y="196" font-size="21" fill="#1565c0" font-style="italic" text-anchor="middle">f</text>
<path d="M 118 200 C 240 60, 530 60, 650 200" fill="none" stroke="#c62828" stroke-width="2.4" marker-end="url(#arr)"/>
<text x="385" y="86" font-size="21" fill="#c62828" font-style="italic" text-anchor="middle">y = f(g(x))</text>
<text x="385" y="120" font-size="15" fill="#546e7a" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif" text-anchor="middle">f ∘ g</text>
<text x="385" y="320" font-size="16" fill="#546e7a" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif" text-anchor="middle">复合链：x —g→ u —f→ y</text>

</svg>
