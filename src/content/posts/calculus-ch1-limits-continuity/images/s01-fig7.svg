      <path d="M0,0 L8,3 L0,6 Z" fill="#111"/>
    </marker>
  </defs>
  <!-- 原点(80,200)，x比例55，y比例40 -->
  <g fill="none" stroke="#111" stroke-width="1.5">
    <line x1="28" y1="200" x2="312" y2="200" marker-end="url(#ar7)"/>
    <line x1="80" y1="258" x2="80" y2="22" marker-end="url(#ar7)"/>
    <g fill="#111" stroke="none">
      <text x="300" y="222">x</text><text x="88" y="30">y</text>
