<svg xmlns="http://www.w3.org/2000/svg" width="460" height="300" viewBox="0 0 460 300" font-family="Times New Roman, serif">
  <!-- 坐标轴 -->
  <defs>
    <marker id="arrowX2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#000"/>
    </marker>
    <marker id="arrowY2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#000"/>
    </marker>
  </defs>
  <line x1="50" y1="255" x2="425" y2="255" stroke="#000" stroke-width="1.5" marker-end="url(#arrowX2)"/>
  <line x1="50" y1="255" x2="50" y2="30" stroke="#000" stroke-width="1.5" marker-end="url(#arrowY2)"/>
  <text x="432" y="259" font-size="15">x</text>
  <text x="43" y="36" font-size="15">y</text>

  <!-- 下界虚线（右端蓝字 -M） -->
  <line x1="50" y1="225" x2="405" y2="225" stroke="#000" stroke-width="1" stroke-dasharray="6,5"/>
  <text x="408" y="230" font-size="14" fill="#1f4fd8" font-style="italic">-M</text>

  <!-- 下降曲线（单调递减、趋近下界） -->
  <path d="M75,85 C115,120 155,155 200,182 C245,205 300,218 365,223"
        fill="none" stroke="#000" stroke-width="1.6"/>

  <!-- 点列 x1..xn -->
  <g fill="#000">
    <circle cx="85"  cy="92"  r="3.2"/>
    <circle cx="140" cy="134" r="3.2"/>
    <circle cx="195" cy="176" r="3.2"/>
    <circle cx="250" cy="201" r="3.2"/>
    <circle cx="305" cy="215" r="3.2"/>
    <circle cx="360" cy="222" r="3.2"/>
  </g>
  <g font-size="13" font-style="italic">
    <text x="79"  y="83">x₁</text>
    <text x="134" y="125">x₂</text>
    <text x="189" y="167">x₃</text>
    <text x="243" y="192">⋯</text>
    <text x="297" y="206">xₙ</text>
  </g>

  <!-- 横轴刻度 -->
  <g stroke="#000" stroke-width="1.2">
    <line x1="85"  y1="252" x2="85"  y2="259"/>
    <line x1="140" y1="252" x2="140" y2="259"/>
    <line x1="195" y1="252" x2="195" y2="259"/>
    <line x1="305" y1="252" x2="305" y2="259"/>
    <line x1="360" y1="252" x2="360" y2="259"/>
  </g>
  <g font-size="13">
    <text x="81"  y="274">1</text>
    <text x="136" y="274">2</text>
    <text x="191" y="274">3</text>
    <text x="247" y="274">⋯</text>
    <text x="356" y="274">n</text>
  </g>

  <!-- 蓝色旁注 -->
  <text x="170" y="50" font-size="14" fill="#1f4fd8" font-style="italic">xₙ ≥ xₙ₊₁,  xₙ ≥ m ?</text>
</svg>
