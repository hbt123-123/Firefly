<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 272" font-family="Cambria Math, Times New Roman, serif" font-size="17">
  <defs>
    <marker id="ar5" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,3 L0,6 Z" fill="#111"/>
    </marker>
  </defs>
  <g fill="none" stroke="#111" stroke-width="1.5">
    <!-- ===== 左幅：μ>0，y=x 与 y=√x，原点(70,224) 比例42 ===== -->
    <line x1="14" y1="224" x2="132" y2="224" marker-end="url(#ar5)"/>
    <line x1="70" y1="256" x2="70" y2="28" marker-end="url(#ar5)"/>
    <g fill="#111" stroke="none">
      <text x="124" y="246">x</text><text x="78" y="36">y</text>
      <text x="54" y="242">O</text>
      <text x="14" y="18">y = xᵘ (μ&gt;0)</text>
    </g>
    <!-- y=x -->
    <line x1="70" y1="224" x2="150" y2="144" stroke-width="2"/>
    <text x="128" y="146" fill="#111" stroke="none">y = x</text>
    <!-- y=√x -->
    <path d="M70,224 C92,224 100,192 112,182 C126,172 140,166 150,161" stroke-width="2"/>
    <text x="116" y="210" fill="#111" stroke="none">y = √x</text>
    <circle cx="112" cy="182" r="3" fill="#111" stroke="none"/>
    <text x="92" y="180" fill="#111" stroke="none" font-size="14">(1,1)</text>

    <!-- ===== 中幅：y=x^μ (μ<0)，y=1/x，原点(290,224) 比例38 ===== -->
    <line x1="220" y1="224" x2="372" y2="224" marker-end="url(#ar5)"/>
    <line x1="290" y1="256" x2="290" y2="28" marker-end="url(#ar5)"/>
    <g fill="#111" stroke="none">
      <text x="364" y="246">x</text><text x="298" y="36">y</text>
      <text x="274" y="242">O</text>
      <text x="222" y="18">y = xᵘ (μ&lt;0)</text>
    </g>
    <!-- 第一象限支 -->
    <path d="M302,42 C304,90 308,130 316,150 C324,172 342,194 370,203" stroke-width="2"/>
    <!-- 第三象限支 -->
    <path d="M210,203 C238,194 256,172 264,150 C272,130 276,90 278,42" stroke-width="2"/>
    <text x="316" y="120" fill="#111" stroke="none">y = 1/x</text>

    <!-- ===== 右幅：y=x^{-2}=1/x²，原点(510,224) 比例38 ===== -->
    <line x1="430" y1="224" x2="602" y2="224" marker-end="url(#ar5)"/>
    <line x1="510" y1="256" x2="510" y2="28" marker-end="url(#ar5)"/>
    <g fill="#111" stroke="none">
      <text x="594" y="246">x</text><text x="518" y="36">y</text>
      <text x="494" y="242">O</text>
      <text x="430" y="18">y = xᵘ</text>
    </g>
    <!-- 右支 -->
    <path d="M596,210 C570,206 548,196 540,176 C533,152 528,92 528,42" stroke-width="2"/>
    <!-- 左支 -->
    <path d="M424,210 C450,206 472,196 480,176 C487,152 492,92 492,42" stroke-width="2"/>
    <circle cx="548" cy="186" r="3" fill="#111" stroke="none"/>
    <text x="556" y="180" fill="#111" stroke="none" font-size="14">(1,1)</text>
    <text x="540" y="120" fill="#111" stroke="none">y = 1/x²</text>
  </g>
</svg>
